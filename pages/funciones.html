<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VANTA CINEMA - Selección de Función</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/funciones.css">
</head>
<body>


  <header class="header-funciones">
    <a id="btnVolverDetalle" href="#" class="btn-volver">← VOLVER A DETALLE</a>
    <div class="logo">VANTA <span>CINEMA</span></div>
  </header>

  <main class="contenedor-funciones">
    <div id="loading" class="loading">Cargando funciones disponibles...</div>

    <div id="contenidoFunciones" class="funciones-layout hidden">
      

      <section class="resumen-pelicula-card">
        <img id="posterPeli" src="" alt="Póster de la película">
        <div class="info-resumen">
          <span id="generosPeli" class="generos-badge">--</span>
          <h1 id="tituloPeli">--</h1>
          <div class="meta-peli">
            <span>⏱️ <strong id="duracionPeli">--</strong> min</span>
            <span>⭐ <strong id="promedioPeli">--</strong> / 10</span>
          </div>
        </div>
      </section>


      <section class="seccion-fechas">
        <h2 class="seccion-titulo">1. SELECCIONA EL DÍA</h2>
        <div id="contenedorFechas" class="fechas-grid">
          <!-- Fechas generadas dinámicamente -->
        </div>
      </section>


      <section class="seccion-horarios">
        <h2 class="seccion-titulo">2. SELECCIONA EL FORMATO Y HORARIO</h2>
        <div id="contenedorHorarios" class="formatos-lista">

        </div>
      </section>


      <div class="barra-confirmacion">
        <div class="info-seleccion">
          <span class="label">FUNCIÓN SELECCIONADA:</span>
          <p id="resumenSeleccion" class="resumen-texto">Ningún horario seleccionado</p>
        </div>
        <button id="btnContinuarAsientos" class="btn-continuar" disabled>
          SELECCIONAR ASIENTOS →
        </button>
      </div>

    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/funciones.js"></script>
</body>
</html>
